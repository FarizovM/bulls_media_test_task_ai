services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bulls_media
      POSTGRES_USER: bulls_media
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bulls_media_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulls_media -d bulls_media"]
      interval: 5s
      timeout: 3s
      retries: 10

  setup:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      - sh
      - -c
      - npm run db:generate && npm run db:migrate && npm run db:seed && npm test
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://bulls_media:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/bulls_media}
      MIGRATION_DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://bulls_media:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/bulls_media}
      DATABASE_SSL: "false"
      AUTH_BYPASS_DEV: "true"
      MOCK_LLM: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "start:dev", "--workspace", "@bulls-media/agent-backend"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      FRONTEND_ORIGINS: http://localhost:5173
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://bulls_media:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/bulls_media}
      DATABASE_SSL: "false"
      AUTH_BYPASS_DEV: "true"
      MOCK_LLM: "true"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./backend/test:/app/backend/test
      - ./backend/prisma.config.ts:/app/backend/prisma.config.ts
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--workspace", "@bulls-media/agent-dashboard"]
    environment:
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_PORT: 5173
      API_PROXY_TARGET: http://backend:3000
      VITE_FILE_WATCH_POLLING: "true"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

volumes:
  bulls_media_pgdata:
